name: CI/CD

on:
  push:
    paths-ignore:
      - 'client/**'
      - '.github/workflows/sdk.yml'
      - '*.md'
      - 'openapi3.yml'
  pull_request:
    paths-ignore:
      - 'client/**'
      - '.github/workflows/sdk.yml'
      - '*.md'
      - 'openapi3.yml'

env:
  PROJECT_NAME: odh-mobility-writer
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}-app
  DOCKER_TAG: ${{ github.sha }}
  JAVA_VERSION: '21'

jobs:

  # Test
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6

      - name: Test code
        uses: noi-techpark/github-actions/maven-test@v2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          test-command: 'mvn -B test'

  # Deploy Test
  deploy-test:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/performance'
    needs: test
    environment: test
    concurrency: deploy-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Build project
        uses: noi-techpark/github-actions/maven-build@v2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-command: 'mvn -B -DskipTests -DfinalName=bdp --projects writer --also-make clean package'

      - name: Build and push images
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add a "unstable" docker tag
        uses: shrink/actions-docker-registry-tag@v2
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}-app
          target: ${{ env.DOCKER_TAG }}
          tags: |
            unstable

      - name: Customize values.yaml
        run: |
          yq -i '
            .image.repository="${{ env.DOCKER_IMAGE }}" |
            .image.tag="${{ env.DOCKER_TAG }}" |
            .image.pullPolicy="IfNotPresent" 
          ' infrastructure/helm/test.yaml
    
      - name: Deploy on cluster  
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: bdp-core
          k8s-namespace: core
          chart-path: infrastructure/helm/bdp-core
          values-file: infrastructure/helm/test.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  # Deploy Test on Scaleway (image is built and pushed by deploy-test)
  deploy-test-scw:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: deploy-test
    environment: test
    concurrency: deploy-test-scw
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_DEV_ACCESS_KEY_ID }}
      SCW_SECRET_KEY: ${{ secrets.SCW_DEV_ACCESS_KEY_SECRET }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ORGANIZATION_ID: d0d90a7d-5b86-4b8a-b271-36ecb405fb9d
      SCW_DEFAULT_PROJECT_ID: af92482c-17f4-4d6c-b435-bb6695dde286
      SCW_CLUSTER_ID: 144c40cb-6737-484e-be30-a2e8b8a49181
      SCW_CLI_VERSION: '2.65.1'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Install Scaleway CLI
        run: |
          curl -fsSL -o scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          sudo install -m 0755 scw /usr/local/bin/scw

      - name: Configure kubeconfig
        run: scw k8s kubeconfig install "$SCW_CLUSTER_ID" region=fr-par

      - name: Customize values.yaml
        run: |
          yq -i '
            .image.repository="${{ env.DOCKER_IMAGE }}" |
            .image.tag="${{ env.DOCKER_TAG }}" |
            .image.pullPolicy="IfNotPresent"
          ' infrastructure/helm/test.yaml

      - name: Deploy on cluster
        run: |
          helm upgrade --install bdp-core infrastructure/helm/bdp-core \
            --values infrastructure/helm/test.yaml \
            --values infrastructure/helm/test-scw.yaml \
            --namespace core \
            --wait --timeout 5m

  # Deploy Prod
  deploy-prod:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/prod'
    needs: test
    environment: prod
    concurrency: deploy-prod
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Build project
        uses: noi-techpark/github-actions/maven-build@v2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-command: 'mvn -B -DskipTests -DfinalName=bdp --projects writer --also-make clean package'

      - name: Build and push images
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add a "latest" docker tag
        uses: shrink/actions-docker-registry-tag@v2
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}-app
          target: ${{ env.DOCKER_TAG }}
          tags: |
            latest

      - name: Customize values.yaml
        run: |
          yq -i '
            .image.repository="${{ env.DOCKER_IMAGE }}" |
            .image.tag="${{ env.DOCKER_TAG }}" |
            .image.pullPolicy="IfNotPresent" 
          ' infrastructure/helm/prod.yaml
    
      - name: Deploy on cluster  
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: bdp-core
          k8s-namespace: core
          chart-path: infrastructure/helm/bdp-core
          values-file: infrastructure/helm/prod.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
